name: HACS and hassfest validation
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
jobs:
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: 'false'
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run hassfest with catalogue branding requirements
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -v "${GITHUB_WORKSPACE}:/github/workspace" \
            ghcr.io/home-assistant/hassfest:latest | tee /tmp/hassfest.log
          # The catalogue rejects brand image warnings even when hassfest succeeds.
          if grep -F '[WARNING] [BRAND_IMAGES]' /tmp/hassfest.log; then
            exit 1
          fi
