name: Generate Home Assistant brand assets
on:
  push:
    branches: [main]
    paths:
      - branding/icon.svg
      - .github/workflows/brand-assets.yml
  pull_request:
    paths:
      - branding/icon.svg
      - .github/workflows/brand-assets.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install SVG converter
        run: python -m pip install 'CairoSVG==2.9.1'
      - name: Generate PNG icons
        run: |
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          folder = Path("custom_components/household_tasks/brand")
          folder.mkdir(parents=True, exist_ok=True)
          for name, size in (("icon.png",256), ("icon@2x.png",512), ("logo.png",256)):
              cairosvg.svg2png(url="branding/icon.svg", write_to=str(folder/name), output_width=size, output_height=size)
          PY
      - name: Upload generated assets for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: household-tasks-brand-assets
          path: custom_components/household_tasks/brand/*.png
          if-no-files-found: error
          retention-days: 7
