name: Bug report
description: Report a reproducible Household Tasks issue
body:
  - type: input
    id: versions
    attributes:
      label: Home Assistant and Household Tasks versions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include opening and closing rule types and expected versus actual behaviour.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs
      description: Remove private calendar titles, names, tokens, addresses and credentials.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked existing issues and restarted Home Assistant after updating.
          required: true
